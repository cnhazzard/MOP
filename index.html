
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Ministry of Pies</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      width: 100%;
      padding: 30px;
    }

    img {
      display: block;
      max-width: 100%;
      max-height: 65vh;
      width: auto;
      height: auto;
      margin: 0 auto 30px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      margin: 0;
    }

    a {
      color: #fff;
      text-decoration: underline;
    }

    a:hover {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main class="container">
    <img src="mop.png" alt="The Ministry of Pies">

    <p>
      We make cool stuff. Email
      <a href="mailto:hello@theministryofpies.com">hello@theministryofpies.com</a>
      to learn more.
    </p>
  </main>
</body>
</html>
